<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bean</title>
<style>
  html,body{margin:0;height:100%;background:#1a1a1a;color:#eee;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  .box{background:#262626;padding:32px 36px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:280px}
  h1{margin:0 0 16px 0;text-align:center;color:#ffd54f}
  label{display:block;font-size:13px;margin-top:10px;color:#bbb}
  input{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:6px;border:1px solid #444;background:#1a1a1a;color:#eee;font-size:14px;margin-top:4px}
  button{margin-top:10px;width:100%;padding:10px;background:#ffd54f;color:#222;border:0;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer}
  button:hover{background:#ffe082}
  button.alt{background:#5c8cd6;color:#fff}
  button.alt:hover{background:#7aa6e6}
  .err{color:#ff6b6b;font-size:13px;text-align:center;margin-top:10px;min-height:18px}
  .sub{font-size:12px;color:#888;text-align:center;margin-top:14px}
</style>
</head>
<body>
<form class="box" id="login" onsubmit="return go(event)">
  <h1>Bean</h1>
  <label>User<input id="u" autofocus autocomplete="off"></label>
  <label>Password<input id="p" type="password"></label>
  <button>Enter</button>
  <div class="err" id="e"></div>
</form>
<div class="box" id="chooser" style="display:none">
  <h1>Choose your slot</h1>
  <button onclick="pick('./game.html')">Classic Megaways</button>
  <button class="alt" onclick="pick('./sfx/game.html')">Megaways with sound</button>
  <button class="alt" onclick="pick('./geese/game.html')">Geese Megaways</button>
  <button class="alt" onclick="pick('./classic3/game.html')">Classic 3×3</button>
  <div class="sub">First load takes ~20s while Python loads. Subsequent loads are fast.</div>
</div>
<div class="box" id="loading" style="display:none">
  <h1>Loading…</h1>
  <div class="sub">Downloading Python runtime — this can take 15-30s on first visit.<br>Game window will appear automatically.</div>
</div>
<script>
const USER="Bean", PASS="QUACK";
function showChooser(){
  document.getElementById("login").style.display="none";
  document.getElementById("chooser").style.display="block";
}
function pick(url){
  document.getElementById("chooser").style.display="none";
  document.getElementById("loading").style.display="block";
  setTimeout(function(){ location.href=url; }, 50);
}
function go(ev){
  ev.preventDefault();
  if(document.getElementById("u").value===USER && document.getElementById("p").value===PASS){
    sessionStorage.setItem("bean_auth","1");
    showChooser();
  } else {
    document.getElementById("e").textContent="Invalid credentials";
  }
  return false;
}
if(sessionStorage.getItem("bean_auth")==="1"){showChooser();}
</script>
</body>
</html>
