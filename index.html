<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bean</title>
<style>
  html,body{margin:0;height:100%;background:#1a1a1a;color:#eee;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  .box{background:#262626;padding:32px 36px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:260px}
  h1{margin:0 0 16px 0;text-align:center;color:#ffd54f}
  label{display:block;font-size:13px;margin-top:10px;color:#bbb}
  input{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:6px;border:1px solid #444;background:#1a1a1a;color:#eee;font-size:14px;margin-top:4px}
  button{margin-top:18px;width:100%;padding:10px;background:#ffd54f;color:#222;border:0;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer}
  button:hover{background:#ffe082}
  .err{color:#ff6b6b;font-size:13px;text-align:center;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<form class="box" onsubmit="return go(event)">
  <h1>Bean</h1>
  <label>User<input id="u" autofocus autocomplete="off"></label>
  <label>Password<input id="p" type="password"></label>
  <button>Enter</button>
  <div class="err" id="e"></div>
</form>
<script>
const USER="Bean", PASS="QUACK";
function go(ev){
  ev.preventDefault();
  if(document.getElementById("u").value===USER && document.getElementById("p").value===PASS){
    sessionStorage.setItem("bean_auth","1");
    location.replace("./game.html");
  } else {
    document.getElementById("e").textContent="Invalid credentials";
  }
  return false;
}
if(sessionStorage.getItem("bean_auth")==="1"){location.replace("./game.html");}
</script>
</body>
</html>
